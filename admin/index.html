<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b3a5c">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>لوحة بيانات المحطة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="fx" aria-hidden="true"></div>

<!-- ===== شاشة تسجيل الدخول ===== -->
<section id="login" class="login" hidden>
  <form id="loginForm" class="lcard" autocomplete="on" novalidate>
    <img class="llogo" src="../img/picc1.png" alt="الهيئة السعودية للمياه">
    <h1>بوابة بيانات المحطة</h1>
    <p class="mut">تنقية سد خليص · دخول الموظفين فقط</p>
    <div id="demoBox" class="demo" hidden>
      <b>وضع تجريبي</b>
      <span>البيانات محفوظة على هذا الجهاز فقط. اختر حساباً للتجربة:</span>
      <div id="demoUsers" class="demoUsers"></div>
    </div>
    <div id="realLogin">
      <label class="fld"><span>البريد الإلكتروني</span>
        <input id="lEmail" type="email" autocomplete="username" required dir="ltr" inputmode="email"></label>
      <label class="fld"><span>كلمة المرور</span>
        <span class="pw"><input id="lPass" type="password" autocomplete="current-password" required dir="ltr">
        <button type="button" class="eye" id="lEye" aria-label="إظهار كلمة المرور">👁</button></span></label>
      <p id="lErr" class="err" role="alert"></p>
      <button class="btn pri wide" id="lBtn" type="submit">تسجيل الدخول</button>
    </div>
  </form>
</section>

<!-- ===== التطبيق ===== -->
<div id="app" hidden>
  <header class="top">
    <img src="../img/picc1.png" alt="" class="tlogo">
    <div class="ttl"><b>لوحة بيانات المحطة</b><small id="demoTag" hidden>وضع تجريبي</small></div>
    <div class="me"><span id="meName"></span><small id="meRole"></small></div>
    <button class="btn ghost sm" id="logout" type="button">خروج</button>
  </header>
  <nav class="tabs" id="tabs" aria-label="الأقسام"></nav>
  <main id="view" class="view" tabindex="-1"></main>
</div>

<div id="modal" class="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><div id="mBody"></div></div></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js" integrity="sha384-rwykjmWNwVxboyFmvK9OXN0wj9hnMHA2aAHtits54DuACyCq0M2PrSNxhRb+hvXT" crossorigin="anonymous"></script>
<script src="../js/config.js"></script>
<script src="../js/core.js"></script>
<script src="admin.js"></script>
</body>
</html>
